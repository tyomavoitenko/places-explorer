# Static analysis configuration. Run with `flutter analyze`.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Generated sources are never hand-edited and should not be linted.
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore # noisy false positives with freezed + json

linter:
  rules:
    - prefer_single_quotes
    - prefer_relative_imports
    - directives_ordering
    - require_trailing_commas
    - unawaited_futures
    - avoid_redundant_argument_values
    - use_super_parameters
    - sized_box_for_whitespace
